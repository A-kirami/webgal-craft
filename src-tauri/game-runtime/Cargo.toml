[package]
name = "webgal-game-runtime"
version = "1.0.0"
edition = "2021"
license = "MPL-2.0"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", optional = true, features = ["macos-private-api", "protocol-asset", "image-png"] }
tauri-plugin-opener = { version = "2.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "webgal-game-runtime"
path = "src/main.rs"
required-features = ["desktop"]
