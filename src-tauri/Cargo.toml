[package]
name = "webgal-craft"
version = "0.0.0"
description = "WebGAL Visual Novel Studio"
authors = ["akirami"]
edition = "2021"

[lib]
name = "webgal_craft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.8"
tauri-plugin-os = "2.3"
tauri-plugin-process = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-fs = { version = "2.5", features = ["watch"] }
tauri-plugin-prevent-default = { version = "5.0", features = ["platform-windows"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
cap-std = "4.0.2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.52", features = ["rt", "sync", "fs", "net", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "system-proxy", "rustls"] }
tempfile = "3.27"
percent-encoding = "2.3"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.10"
tauri-plugin-window-state = "2.4"
trash = "5.2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
