name: Game runtimes

on:
  workflow_call:

jobs:
  build:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          platform: ${{ matrix.platform }}
          rust-targets: ${{ matrix.target }}
      - name: Build game runtime
        run: bun run build:game-runtime --target ${{ matrix.target }} --release
      - name: Upload game runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-runtime-${{ matrix.platform }}
          path: src-tauri/resources/game-runtimes/webgal-game-runtime-*
          if-no-files-found: error
