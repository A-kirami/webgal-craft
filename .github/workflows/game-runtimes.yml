name: Game runtimes

on:
  workflow_call:

jobs:
  build:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          platform: ${{ matrix.platform }}
          rust-targets: ${{ matrix.target }}
      - name: Build game runtime
        run: bun run build:game-runtime --target ${{ matrix.target }} --release
      - name: Verify Windows installer lifecycle
        if: matrix.platform == 'windows-x64'
        run: node scripts/verify-game-installer.mjs src-tauri/resources/game-runtimes/webgal-game-runtime-windows-x64.exe
      - name: Verify native installer generation
        if: matrix.platform == 'linux-x64' || matrix.platform == 'macos-arm64'
        shell: bash
        env:
          WEBGAL_INSTALLER_SMOKE_RUNTIME: ${{ github.workspace }}/src-tauri/resources/game-runtimes/webgal-game-runtime-${{ matrix.platform }}
          WEBGAL_INSTALLER_SMOKE_DIR: ${{ runner.temp }}/game-installer-smoke
          WEBGAL_INSTALLER_SMOKE_KEY: installer-smoke-${{ github.run_id }}-${{ matrix.platform }}
          WEBGAL_INSTALLER_SMOKE_PACKAGER: ${{ github.workspace }}/src-tauri/target/debug/webgal-craft
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin webgal-craft
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib commands::export::tests::builds_native_installers_for_smoke_test -- --ignored --exact --nocapture
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            dpkg-deb --info "$WEBGAL_INSTALLER_SMOKE_DIR/first/game.deb"
            dpkg-deb --info "$WEBGAL_INSTALLER_SMOKE_DIR/upgrade/game.deb"
            dpkg-deb --extract "$WEBGAL_INSTALLER_SMOKE_DIR/first/game.deb" "$WEBGAL_INSTALLER_SMOKE_DIR/extracted"
            smoke_id="$(bun -e 'import { createHash } from "node:crypto"; process.stdout.write("com.webgalcraft.game." + createHash("sha256").update(process.env.WEBGAL_INSTALLER_SMOKE_KEY).digest("hex"))')"
            test -x "$WEBGAL_INSTALLER_SMOKE_DIR/extracted/usr/bin/$smoke_id"
            test -f "$WEBGAL_INSTALLER_SMOKE_DIR/extracted/usr/lib/$smoke_id/webgal-runtime.json"
            test -f "$WEBGAL_INSTALLER_SMOKE_DIR/extracted/usr/lib/$smoke_id/resources/index.html"
          else
            hdiutil imageinfo "$WEBGAL_INSTALLER_SMOKE_DIR/first/game.dmg"
            hdiutil imageinfo "$WEBGAL_INSTALLER_SMOKE_DIR/upgrade/game.dmg"
            mount_point="$WEBGAL_INSTALLER_SMOKE_DIR/mounted"
            mkdir "$mount_point"
            hdiutil attach "$WEBGAL_INSTALLER_SMOKE_DIR/first/game.dmg" -nobrowse -mountpoint "$mount_point"
            trap 'hdiutil detach "$mount_point"' EXIT
            test -x "$mount_point/Installer smoke.app/Contents/MacOS/Installer smoke"
            test -f "$mount_point/Installer smoke.app/Contents/Resources/webgal-runtime.json"
            test -f "$mount_point/Installer smoke.app/Contents/Resources/resources/index.html"
          fi
      - name: Upload game runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-runtime-${{ matrix.platform }}
          path: src-tauri/resources/game-runtimes/webgal-game-runtime-*
          if-no-files-found: error
