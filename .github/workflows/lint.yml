name: Lint

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: js
            command: bun lint:js
          - name: style
            command: bun lint:style
          - name: i18n
            command: bun lint:i18n
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Run lint checks
        run: ${{ matrix.command }}
