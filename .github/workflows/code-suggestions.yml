name: Code Suggestions

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - ".github/workflows/code-suggestions.yml"
      - ".github/workflows/lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  code-suggestions:
    name: suggest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Run ESLint with reviewdog
        id: eslint
        continue-on-error: true
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          reporter: github-pr-review
          tool_name: eslint
          eslint_flags: "**/*.{js,jsx,ts,tsx,cjs,mjs,vue}"

      - name: Run ESLint i18n with reviewdog
        id: i18n
        continue-on-error: true
        uses: reviewdog/action-eslint@556a3fdaf8b4201d4d74d406013386aa4f7dab96 # v1.34.0
        with:
          reporter: github-pr-review
          tool_name: i18n
          eslint_flags: "src/locales/*.{json,json5,yaml,yml}"

      - name: Run Stylelint with reviewdog
        id: stylelint
        continue-on-error: true
        uses: reviewdog/action-stylelint@dd2b435cc6a7c82705307a9dee740c9bbaa10411 # v1.30.2
        with:
          reporter: github-pr-review
          stylelint_input: "src/**/*.{css,vue}"

      - name: Fail if any suggestion check failed
        if: ${{ steps.eslint.outcome == 'failure' || steps.i18n.outcome == 'failure' || steps.stylelint.outcome == 'failure' }}
        run: exit 1
