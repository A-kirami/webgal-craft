name: Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundle: appimage
          - os: macos-latest
            platform: macos-x64
            target: x86_64-apple-darwin
            bundle: dmg
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: nsis

    env:
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_BUILD_SHA: ${{ github.event.pull_request && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Build app
        id: tauri-build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          includeDebug: ${{ github.event_name == 'pull_request' }}
          includeRelease: ${{ github.event_name != 'pull_request' }}
          args: -t ${{ matrix.target }} -b ${{ matrix.bundle }} -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Compute artifact name
        id: artifact-name
        shell: bash
        run: |
          short_sha="${GITHUB_BUILD_SHA:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            build_mode="debug"
            build_suffix="pr-${GITHUB_PR_NUMBER}-${short_sha}"
          else
            build_mode="release"
            build_suffix="commit-${short_sha}"
          fi

          echo "name=webgal-craft-v${{ steps.tauri-build.outputs.appVersion }}-${{ matrix.platform }}-${build_mode}-${build_suffix}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: "${{ join(fromJSON(steps.tauri-build.outputs.artifactPaths), '\n') }}"
