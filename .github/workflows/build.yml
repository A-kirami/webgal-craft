name: Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            args: -t x86_64-unknown-linux-gnu -b appimage
            mobile: ""
            rustTargets: ""
          - os: macos-latest
            platform: macos-x64
            args: -t x86_64-apple-darwin -b dmg
            mobile: ""
            rustTargets: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm64
            args: -t aarch64-apple-darwin -b dmg
            mobile: ""
            rustTargets: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            args: -t x86_64-pc-windows-msvc -b nsis
            mobile: ""
            rustTargets: ""
          - os: ubuntu-latest
            platform: android-arm64
            args: --target aarch64 --apk
            mobile: android
            rustTargets: aarch64-linux-android

    env:
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_BUILD_SHA: ${{ github.event.pull_request && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rustTargets }}

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Android NDK
        if: matrix.mobile == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ./src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Initialize Android project
        if: matrix.mobile == 'android'
        run: bun tauri android init --ci --skip-targets-install
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build app
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          args: ${{ matrix.args }} -c '{"bundle":{"createUpdaterArtifacts":false}}' ${{ github.event_name == 'pull_request' && '--debug' || '' }}
          mobile: ${{ matrix.mobile }}

      - name: Compute artifact name
        id: artifact-name
        shell: bash
        run: |
          short_sha="${GITHUB_BUILD_SHA:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            build_mode="debug"
            build_suffix="pr-${GITHUB_PR_NUMBER}-${short_sha}"
          else
            build_mode="release"
            build_suffix="commit-${short_sha}"
          fi

          echo "name=webgal-craft-v${{ steps.tauri-build.outputs.appVersion }}-${{ matrix.platform }}-${build_mode}-${build_suffix}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: "${{ join(fromJSON(steps.tauri-build.outputs.artifactPaths), '\n') }}"
