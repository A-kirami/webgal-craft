name: Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "src/**"
      - "!src/**/__tests__/**"
      - "!src/**/*.test.ts"
      - "!src/**/*.spec.ts"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "*.config.js"
      - "*.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            args: -t x86_64-unknown-linux-gnu -b appimage
            mobile: ""
            rustTargets: ""
          - os: macos-latest
            platform: macos-x64
            args: -t x86_64-apple-darwin -b dmg
            mobile: ""
            rustTargets: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm64
            args: -t aarch64-apple-darwin -b dmg
            mobile: ""
            rustTargets: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            args: -t x86_64-pc-windows-msvc -b nsis
            mobile: ""
            rustTargets: ""
          - os: ubuntu-latest
            platform: android-arm64
            args: --target aarch64 --apk --split-per-abi --ci
            mobile: android
            rustTargets: aarch64-linux-android

    env:
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_BUILD_SHA: ${{ github.event.pull_request && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # 构建环境准备统一在 .github/actions/prepare-build，勿在此复制等价步骤
      - name: Prepare build environment
        id: prepare
        uses: $/.github/actions/prepare-build
        with:
          platform: ${{ matrix.platform }}
          mobile: ${{ matrix.mobile }}
          rust-targets: ${{ matrix.rustTargets }}

      - name: Build app
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NDK_HOME: ${{ steps.prepare.outputs.ndk-path }}
        with:
          args: ${{ matrix.args }} -c '{"bundle":{"createUpdaterArtifacts":false}}' ${{ github.event_name == 'pull_request' && '--debug' || '' }}
          mobile: ${{ matrix.mobile }}

      - name: Compute artifact name
        id: artifact-name
        shell: bash
        run: |
          short_sha="${GITHUB_BUILD_SHA:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            build_mode="debug"
            build_suffix="pr-${GITHUB_PR_NUMBER}-${short_sha}"
          else
            build_mode="release"
            build_suffix="commit-${short_sha}"
          fi

          echo "name=webgal-craft-v${{ steps.tauri-build.outputs.appVersion }}-${{ matrix.platform }}-${build_mode}-${build_suffix}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: "${{ join(fromJSON(steps.tauri-build.outputs.artifactPaths), '\n') }}"
