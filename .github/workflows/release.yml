name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(bun -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}. Expected ${expected_tag}."
            exit 1
          fi

  changelog:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      changelog: ${{ steps.release-drafter.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate release changelog
        id: release-drafter
        uses: release-drafter/release-drafter@693d20e7c1ce1a81d3a41962f85914253b518449 # v7.3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    name: ${{ matrix.platform }}
    needs: changelog
    environment: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            releaseLabel: linux-64-bit
            args: -t x86_64-unknown-linux-gnu
            mobile: ""
            rustTargets: ""
          - os: macos-latest
            platform: macos-x64
            releaseLabel: macos-intel
            args: -t x86_64-apple-darwin
            mobile: ""
            rustTargets: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm64
            releaseLabel: macos-apple-silicon
            args: -t aarch64-apple-darwin
            mobile: ""
            rustTargets: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x64
            releaseLabel: windows-64-bit
            args: -t x86_64-pc-windows-msvc
            mobile: ""
            rustTargets: ""
          - os: ubuntu-latest
            platform: android-arm64
            releaseLabel: android-arm64
            args: --target aarch64 --apk --split-per-abi --ci
            mobile: android
            rustTargets: aarch64-linux-android

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Configure Android signing
        if: matrix.mobile == 'android'
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_BASE64}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android release signing secrets are not configured."
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/webgal-craft-release.jks"
          printf '%s' "${ANDROID_KEY_BASE64}" | base64 --decode > "${keystore_path}"
          {
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'password=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'storeFile=%s\n' "${keystore_path}"
          } > src-tauri/gen/android/keystore.properties

      # 构建环境准备统一在 .github/actions/prepare-build，勿在此复制等价步骤
      - name: Prepare build environment
        id: prepare
        uses: $/.github/actions/prepare-build
        with:
          platform: ${{ matrix.platform }}
          mobile: ${{ matrix.mobile }}
          rust-targets: ${{ matrix.rustTargets }}

      - name: Build and create release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NDK_HOME: ${{ steps.prepare.outputs.ndk-path }}
        with:
          tagName: v__VERSION__
          releaseName: WebGAL Craft v__VERSION__
          releaseBody: ${{ needs.changelog.outputs.changelog }}
          releaseDraft: true
          releaseAssetNamePattern: "webgal-craft-v[version]-${{ matrix.releaseLabel }}[setup][ext]"
          uploadUpdaterJson: ${{ matrix.mobile != 'android' }}
          mobile: ${{ matrix.mobile }}
          args: ${{ matrix.args }}

      - name: Verify Android APK signature
        if: matrix.mobile == 'android'
        shell: bash
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo "Android release APK was not generated."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "${ANDROID_HOME}/build-tools/${{ steps.prepare.outputs.android-build-tools }}/apksigner" verify --verbose "${apk}"
          done
